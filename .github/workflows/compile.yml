name: ESPHome Compile

on:
  push:
    branches: [master]
  pull_request:

jobs:
  compile:
    name: Compile ESPHome firmware
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # The ESP-IDF toolchain (~500 MB) lives in ~/.platformio.
      # Keyed to the ESPHome version so a version bump refreshes the cache.
      - name: Cache PlatformIO / ESP-IDF toolchain
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Compiled object files for the component and generated sources.
      # Keyed to the component source + test YAML so any code change triggers
      # a rebuild while unchanged runs stay fast (~2 min vs ~15 min cold).
      - name: Cache ESPHome build artifacts
        uses: actions/cache@v4
        with:
          path: tests/.esphome
          key: esphome-build-${{ runner.os }}-${{ hashFiles('components/ancs/**', 'tests/test-ancs.yaml') }}
          restore-keys: esphome-build-${{ runner.os }}-

      - name: Install ESPHome
        run: pip install -r requirements.txt

      # Fast schema + codegen validation — catches Python errors in __init__.py
      # before spending time on a full compile.
      - name: Validate config
        run: esphome config tests/test-ancs.yaml

      # Full compile: C++ compilation + link. Confirms the component builds
      # cleanly against ESP-IDF and that no NimBLE symbols are missing.
      - name: Compile firmware
        run: esphome compile tests/test-ancs.yaml
