# ESPHome ANCS Component — package with sensors
#
# Standalone package — includes the component AND pre-wires the binary_sensor, text_sensor, and
# button platforms. Requires your config to define:
#   - substitutions.friendly_name  — used as entity name prefix in Home Assistant
#   - api: or mqtt:                — to surface sensors in Home Assistant
#
# Usage:
#   packages:
#     ancs_sensors: github://wonderslug/esphome-ancs/packages/ancs-with-sensors.yaml@master
#
# Override the BLE pairing name (shown in nRF Connect when pairing):
#   substitutions:
#     friendly_name: "Living Room"
#     ancs_name: "Living Room ANCS"   # optional, defaults to "ANCS HA Bridge"

substitutions:
  ancs_name: "ANCS HA Bridge"

external_components:
  - source:
      type: git
      url: https://github.com/wonderslug/esphome-ancs
      ref: master
    components: [ancs]

ancs:
  id: my_ancs
  name: "${ancs_name}"

binary_sensor:
  - platform: ancs
    ancs_id: my_ancs
    connected:
      name: "${friendly_name} iPhone Connected"
    call_active:
      name: "${friendly_name} Call Active"

text_sensor:
  - platform: ancs
    ancs_id: my_ancs
    connected_device:
      name: "${friendly_name} Connected iPhone"
    last_title:
      name: "${friendly_name} Last Notification"
    last_message:
      name: "${friendly_name} Last Message"
    last_caller:
      name: "${friendly_name} Last Caller"
    last_app_id:
      name: "${friendly_name} Last App"

button:
  # Forget all paired phones and restart advertising so a new phone can pair.
  - platform: template
    name: "${friendly_name} Clear Bonds"
    icon: "mdi:link-off"
    entity_category: config
    on_press:
      - ancs.clear_bonds: my_ancs

  # Drop the current BLE link; the phone will typically reconnect on its own.
  - platform: template
    name: "${friendly_name} Disconnect iPhone"
    icon: "mdi:bluetooth-off"
    entity_category: config
    on_press:
      - ancs.disconnect: my_ancs
