# ESPHome ANCS Component — Home Assistant events package
#
# Fires three HA events when iPhone notifications arrive via ANCS:
#
#   esphome.ancs_incoming_call  — incoming call; payload: uid, caller, app_id, date, device_name, iphone_name
#   esphome.ancs_notification   — all other categories; payload: uid, category, app_id,
#                                 title, subtitle, message, date, device_name, iphone_name
#   esphome.ancs_call_ended     — call declined or answered; payload: uid, device_name, iphone_name
#
# Standalone package — no other packages required. Include it and add your connectivity config.
#
# Requirements:
#   - api: configured in your main config (events travel over the ESPHome API)
#
# Usage (GitHub — recommended):
#   packages:
#     ancs_ha_events: github://wonderslug/esphome-ancs/packages/ancs-ha-events.yaml@master
#
# Pin to a release for production:
#   packages:
#     ancs_ha_events: github://wonderslug/esphome-ancs/packages/ancs-ha-events.yaml@v1.0.0
#
# Local development:
#   packages:
#     ancs_ha_events: !include packages/ancs-ha-events.yaml
#
# Override the BLE pairing name (shown in nRF Connect when pairing):
#   substitutions:
#     ancs_name: "My iPhone Bridge"
#
# Override the component ref (useful for development or feature branches):
#   substitutions:
#     ancs_ref: "feat/my-branch"

substitutions:
  ancs_name: "ANCS HA Bridge"
  ancs_ref: "master"

external_components:
  - source:
      type: git
      url: https://github.com/wonderslug/esphome-ancs
      ref: "${ancs_ref}"
    components: [ancs]

ancs:
  id: my_ancs
  name: "${ancs_name}"
  auto_fetch_attributes: true
  fetch_attributes: [app_id, title, subtitle, message, date]
  on_notification_attributes:
    - logger.log:
        format: "ATTRS     uid=%u  dev=%-16s  cat=%-16s  app=%s  title=%s  sub=%s  msg=%s  date=%s"
        tag: "ancs.notification_attrs"
        args:
          - uid
          - device_name.c_str()
          - category.c_str()
          - app_id.c_str()
          - title.c_str()
          - subtitle.c_str()
          - message.c_str()
          - date.c_str()
    - if:
        condition:
          lambda: 'return category == "incoming_call";'
        then:
          - homeassistant.event:
              event: esphome.ancs_incoming_call
              data:
                uid: !lambda 'return std::to_string(uid);'
                caller: !lambda 'return title;'
                app_id: !lambda 'return app_id;'
                date: !lambda 'return date;'
                device_name: !lambda 'return std::string(App.get_name());'
                iphone_name: !lambda 'return device_name;'
        else:
          - homeassistant.event:
              event: esphome.ancs_notification
              data:
                uid: !lambda 'return std::to_string(uid);'
                category: !lambda 'return category;'
                app_id: !lambda 'return app_id;'
                title: !lambda 'return title;'
                subtitle: !lambda 'return subtitle;'
                message: !lambda 'return message;'
                date: !lambda 'return date;'
                device_name: !lambda 'return std::string(App.get_name());'
                iphone_name: !lambda 'return device_name;'

  # Only incoming_call removals fire an event; other notification removals are intentionally ignored.
  on_notification_removed:
    - logger.log:
        format: "REMOVED   uid=%u  dev=%-16s  cat=%-16s"
        tag: "ancs.notification_removed"
        args:
          - uid
          - device_name.c_str()
          - category.c_str()
    - if:
        condition:
          lambda: 'return category == "incoming_call";'
        then:
          - homeassistant.event:
              event: esphome.ancs_call_ended
              data:
                uid: !lambda 'return std::to_string(uid);'
                device_name: !lambda 'return std::string(App.get_name());'
                iphone_name: !lambda 'return device_name;'
